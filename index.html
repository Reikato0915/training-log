<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>筋トレ記録</title>
  <meta name="description" content="PPL×種目×セットを記録し、週ごとの部位別セット数・総負荷量を集計する">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#141311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">IRON<b>LOG</b></span>
    <button id="sync-status" class="sync-dot" type="button" aria-label="同期状態"></button>
  </header>
  <main id="app"></main>
  <nav class="tabbar" aria-label="画面切り替え">
    <button class="tab" data-view="log" type="button"><span aria-hidden="true">✎</span>記録</button>
    <button class="tab" data-view="week" type="button"><span aria-hidden="true">▤</span>週集計</button>
    <button class="tab" data-view="weight" type="button"><span aria-hidden="true">⚖</span>体重</button>
    <button class="tab" data-view="settings" type="button"><span aria-hidden="true">⚙</span>設定</button>
  </nav>
  <script type="module" src="src/app.js"></script>

</html>
